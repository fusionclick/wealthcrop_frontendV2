<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
  <title id="t">Where a SIP instalment goes</title>
  <desc id="d">Four steps: your bank account is debited on the SIP date, the fund buys units at that day's NAV, the units are added to your folio, and your holding is worth units times the current NAV.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <style>
    .card { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 2; }
    .num { fill: #2563eb; }
    .numtext { fill: #ffffff; font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .head { fill: #172554; font: 700 19px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .body { fill: #334155; font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .title { fill: #172554; font: 700 24px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .formula { fill: #14532d; font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .note { fill: #475569; font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>

  <rect x="1" y="1" width="958" height="438" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text class="title" x="35" y="52">Where a SIP instalment goes</text>

  <!-- 1 -->
  <rect class="card" x="35" y="80" width="200" height="180" rx="14"/>
  <circle class="num" cx="65" cy="112" r="17"/>
  <text class="numtext" x="65" y="118" text-anchor="middle">1</text>
  <text class="head" x="55" y="160">Your bank</text>
  <text class="body" x="55" y="188">The instalment is</text>
  <text class="body" x="55" y="208">debited on your</text>
  <text class="body" x="55" y="228">SIP date</text>

  <line x1="237" y1="170" x2="261" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <rect class="card" x="265" y="80" width="200" height="180" rx="14"/>
  <circle class="num" cx="295" cy="112" r="17"/>
  <text class="numtext" x="295" y="118" text-anchor="middle">2</text>
  <text class="head" x="285" y="160">The fund</text>
  <text class="body" x="285" y="188">buys units at</text>
  <text class="body" x="285" y="208">that day's NAV</text>

  <line x1="467" y1="170" x2="491" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <rect class="card" x="495" y="80" width="200" height="180" rx="14"/>
  <circle class="num" cx="525" cy="112" r="17"/>
  <text class="numtext" x="525" y="118" text-anchor="middle">3</text>
  <text class="head" x="515" y="160">Your folio</text>
  <text class="body" x="515" y="188">The new units join</text>
  <text class="body" x="515" y="208">the ones you</text>
  <text class="body" x="515" y="228">already hold</text>

  <line x1="697" y1="170" x2="721" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 4 -->
  <rect class="card" x="725" y="80" width="200" height="180" rx="14"/>
  <circle class="num" cx="755" cy="112" r="17"/>
  <text class="numtext" x="755" y="118" text-anchor="middle">4</text>
  <text class="head" x="745" y="160">Your holding</text>
  <text class="body" x="745" y="188">is worth all your</text>
  <text class="body" x="745" y="208">units × today's</text>
  <text class="body" x="745" y="228">NAV</text>

  <!-- the rule underneath -->
  <rect x="35" y="292" width="890" height="112" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text class="formula" x="60" y="330">Units bought = instalment ÷ that day's NAV</text>
  <text class="note" x="60" y="358">Same amount every month: when the NAV is lower it buys more units, when it is higher it buys fewer.</text>
  <text class="note" x="60" y="382">Next month's instalment starts again at step 1 — the units keep adding up.</text>
</svg>
