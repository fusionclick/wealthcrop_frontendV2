# Container ke andar wala nginx. TLS yahan NAHI hai — wo host nginx ka kaam hai.
# Host nginx saari traffic 8080 pe bhejta hai, isliye /api/bse yahan hi handle karo
# (server SSH / host nginx edit ki zaroorat nahi — CI image update se deploy).
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # ponytail: HTTPS site → HTTP Node BSE, mixed-content bypass
  location /api/bse/socket.io {
    proxy_pass http://13.203.216.202:3000/api/socket.io;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
  }

  location /api/bse/ {
    proxy_pass http://13.203.216.202:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header Authorization     $http_authorization;
    proxy_set_header X-Authorization   $http_x_authorization;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }

  # SPA fallback — /login jaise routes par bhi index.html do (yehi kaam _redirects karta tha)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # hashed assets kabhi badalte nahi, unhe lamba cache karne do
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
